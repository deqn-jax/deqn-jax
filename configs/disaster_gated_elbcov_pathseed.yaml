# Disaster — GATED + ELB-COVERAGE arm (spec-let 1, full): the kink-aware
# anchor (stop teaching lies at the floor) composed with ELB-targeted
# coverage (supply residual pressure exactly there). The division of labor
# validated on irbc 2026-07-06 (anchor = selection, coverage = certification),
# applied to the disaster model's one on-path kink.
model: disaster
episodes: 3000
batch_size: 64
episode_length: 20
mc_samples: 2
seed: 42
fp64: true
log_every: 100
warm_start: true
curriculum_episodes: 200
curriculum_start: 0.1
ss_reset_frac: 0.15

network:
  type: disaster_policy_net
  hidden_sizes: [128, 128]
  activation: tanh
  init: xavier_normal
  init_scale: 0.0   # 0.0 = exact linear policy at init; delta grows via training

optimizer:
  name: adam
  learning_rate: 1e-4
  lr_schedule: cosine
  lr_warmup: 100
  lr_min_factor: 0.05
  grad_clip: 0.5

shock_mask: [1, 1, 1, 1, 1]
expectation_type: quadrature
n_quadrature_points: 3

loss_type: composite
composite_loss:
  anchor_weight: 1.0      # supervised: match linearized policy at anchor points
  jac_weight: 0.1         # supervised: match dπ/ds(SS) = P
  barrier_weight: 0.01
  newton_weight: 0.01
  n_anchor_points: 128
  anchor_sigma: 1.0
  aux_decay_floor: 1.0    # keep anchor active throughout training
  anchor_gate: true       # kink-aware: mute anchor points past the rate floor

checkpoint_dir: checkpoints/disaster_gated_elbcov
checkpoint_every: 250
max_checkpoints: 15
tensorboard_dir: runs/disaster_gated_elbcov

coverage:
  stress_seed_mode: path   # paper's measure: seeds = visited states, stress dims overridden
  enabled: true
  rho_base: 1.0
  rho_stress: 0.5
  rho_local: 0.0       # local pool off in v1 (heterogeneous state scales)
  n_stress: 64
  n_local: 0
  rollout_horizon: 5
  local_sigma: 0.0
  stress_ranges:
    m_p: [-0.03, -0.01]      # 2-6 sigma_mp negative: Taylor rate through the floor
    R_lag: [1.000, 1.010]    # low recent rate (smoothing rho_p=0.85 carries it)
    pi_lag: [0.995, 1.008]   # below-target lagged inflation
  repair_ranges:
    pi_lag: [0.95, 1.10]
    k_lag: [15.0, 40.0]
    c_lag: [0.6, 3.0]
    q_lag: [0.5, 1.5]
    i_lag: [0.4, 1.6]
    R_lag: [0.98, 1.06]
    w_tilda_lag: [1.0, 3.0]
    L_lag: [1.1, 3.5]
    m_p: [-0.05, 0.05]
