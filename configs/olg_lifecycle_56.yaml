# 56-generation life-cycle OLG with borrowing constraints (annual frequency).
#
# The dimensionality-scale companion of olg_lifecycle: 57-dim state
# (Z, k0..k55), 55 saving-rate policies, 55 Fischer-Burmeister Euler
# complementarities via the two-stage loss (E[fb] != fb(E)). No closed-form
# steady state -> trained over the ergodic distribution from a random
# exp(U(0,1)) init. Calibration = annual counterpart of the 6-gen decade
# calibration (derivations in models/olg_lifecycle_56/variables.py).
#
# Recipe follows the olg_lifecycle lineage: hidden = 10 * n_input per layer
# (10 * 57 = 570), relu, xavier_uniform, adam 3e-4.

model: olg_lifecycle_56

episodes: 3000
batch_size: 128
episode_length: 24
mc_samples: 8
seed: 0

initialize_each_episode: false
n_epochs_per_rollout: 1
n_minibatches_per_epoch: 1

network:
  type: mlp
  hidden_sizes: [570, 570]
  activation: relu
  init: xavier_uniform

optimizer:
  name: adam
  learning_rate: 3.0e-4
  lr_schedule: constant

warm_start: false             # no closed-form SS; learns the ergodic set from init
log_every: 200
