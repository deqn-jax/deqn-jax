# Disaster — GATED + SURGERY, WIDE arm (exit 1: capacity scaling, 2026-07-10).
# = disaster_gated_pcgrad with hidden 256x256 (4x params). Tests whether the
# GN-polish identification wedge (residual floor ~1.8e-2 on the frozen grid,
# certificates destroyed en route) is a capacity artifact of 128x128.
# = disaster_gated.yaml + gradient_surgery: pcgrad. Motivated by a measured
# diagnostic at the trained gated basin (checkpoint_003000, s0): total grad
# norm 3.6 with price-Phillips vs wage-Phillips per-equation gradient
# cosines of -0.89..-0.92 — the rho~1.05 basin is a COMPROMISE POINT of a
# price/wage tug-of-war, not a joint zero. PCGrad removes the conflicting
# gradient components before summing; the composite aux stack (anchor, gate,
# jac, barriers, Newton) is added unprojected via grad(total)-grad(base)
# (optimizers/pcgrad.py), so the certified anchor recipe is untouched and
# the only delta vs disaster_gated is the surgery itself.
model: disaster
episodes: 3000
batch_size: 64
episode_length: 20
mc_samples: 2
seed: 42
fp64: true
log_every: 100
warm_start: true
curriculum_episodes: 200
curriculum_start: 0.1
ss_reset_frac: 0.15

gradient_surgery: pcgrad

network:
  type: disaster_policy_net
  hidden_sizes: [256, 256]
  activation: tanh
  init: xavier_normal
  init_scale: 0.0   # 0.0 = exact linear policy at init; delta grows via training

optimizer:
  name: adam
  learning_rate: 1e-4
  lr_schedule: cosine
  lr_warmup: 100
  lr_min_factor: 0.05
  grad_clip: 0.5

shock_mask: [1, 1, 1, 1, 1]
expectation_type: quadrature
n_quadrature_points: 3

loss_type: composite
composite_loss:
  anchor_weight: 1.0      # supervised: match linearized policy at anchor points
  jac_weight: 0.1         # supervised: match dπ/ds(SS) = P
  barrier_weight: 0.01
  newton_weight: 0.01
  n_anchor_points: 128
  anchor_sigma: 1.0
  aux_decay_floor: 1.0    # keep anchor active throughout training
  anchor_gate: true       # kink-aware: mute anchor points past the rate floor

checkpoint_dir: checkpoints/disaster_gated_pcgrad_wide
checkpoint_every: 250
max_checkpoints: 15
tensorboard_dir: runs/disaster_gated_pcgrad_wide
