# 2-country IRBC — COMPOSITION arm: BK-anchor composite recipe (irbc.yaml)
# + EWM coverage block (irbc_ewm.yaml). Tests whether the two levers are
# complementary: composite anchor/jac = SELECTION (rho(SS)<1, the 2026-06-11
# stability recipe), coverage = CERTIFICATION (stress-region residuals, the
# 2026-07-02 5-seed result). The composed loss is composite∘coverage: the
# base residual term is imposed on the base+stress+local mixture, anchor/jac
# added once on top (see training/composite_loss.py::_build_custom_loss_fn).
#
# Coverage knobs identical to irbc_ewm.yaml (fixed a priori, never tuned on
# the reported metrics); composite knobs identical to irbc.yaml.
model: irbc

episodes: 4001
batch_size: 128
episode_length: 1
mc_samples: 1                # ignored under quadrature
expectation_type: gauss_hermite
n_quadrature_points: 3       # 3^3 = 27 shock-grid points

initialize_each_episode: true
n_epochs_per_rollout: 1
n_minibatches_per_epoch: 1

loss_type: composite
composite_loss:
  anchor_weight: 1.0
  jac_weight: 1.0
  aux_decay_floor: 1.0

network:
  type: linear_plus_mlp
  hidden_sizes: [64, 64]
  activation: tanh
  init: xavier_uniform

optimizer:
  name: adam
  learning_rate: 1.0e-3
  lr_schedule: constant

loss_reweight: none
warm_start: false
log_every: 200

coverage:
  enabled: true
  rho_base: 1.0
  rho_stress: 0.5
  rho_local: 0.25
  n_stress: 128
  n_local: 128
  rollout_horizon: 5
  local_sigma: 0.02
  stress_ranges:
    z_0: [-0.18, -0.05]  # recession tail: ~1-4 stationary sd down
    z_1: [-0.18, -0.05]  # (independent per-dim draws -> asymmetric combos too)
    k_0: [1.05, 1.20]    # high capital -> desired disinvestment -> i>=0 binds
    k_1: [1.05, 1.20]
  repair_ranges:
    k_0: [0.2, 5.0]      # feasible box: stress landings + local perturbations
    k_1: [0.2, 5.0]      # are clipped here before the residual (repair step)
    z_0: [-0.2, 0.2]     # ~ +-4.4 stationary sd
    z_1: [-0.2, 0.2]
